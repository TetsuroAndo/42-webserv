<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Access Forbidden</title>
    <style>
        body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:2rem;background:#f7f8fa;color:#111}
        .container{max-width:720px;margin:0 auto;text-align:center;padding:2rem;background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(15,23,42,0.06)}
        h1{margin:0 0 .5rem;font-size:1.5rem}
        p{margin:.5rem 0;color:#444}
        .meta{margin-top:1rem;color:#6b7280;font-size:.9rem}
        a.button{display:inline-block;margin-top:1rem;padding:.6rem 1rem;background:#0066cc;color:#fff;text-decoration:none;border-radius:6px}
        .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f3f4f6;padding:.25rem .5rem;border-radius:4px}
    </style>
</head>
<body>
<div class="container" role="main" aria-labelledby="title">
    <h1 id="title">Access Forbidden</h1>
    <p>You attempted to access a directory. Directory listing is disabled on this server, so the contents cannot be displayed.</p>
    <p>If you believe you reached this page in error, please contact the site administrator.</p>
    <p class="meta"><span class="code">403 — Directory Access Denied</span></p>
    <a href="/" class="button" rel="home">Return to Home</a>
</div>
</body>
</html>
