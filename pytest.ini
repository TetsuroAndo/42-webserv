[pytest]
minversion = 6.0
addopts = -ra -v
testpaths =
    test/test_suite
    test/stress
    test/protocol
markers =
    core: サーバーの起動と設定パースのテスト
    http: 基本的なHTTPメソッドとレスポンスのテスト
    cgi: CGI機能のテスト
    upload: ファイルアップロードのテスト
    stress: 負荷・ノンブロッキングのテスト
    protocol: 低レベルなプロトコル堅牢性テスト
    integration: 統合テスト
    config: テスト用設定ファイルを指定するマーカー
