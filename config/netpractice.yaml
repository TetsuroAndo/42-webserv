servers:
  - server:
      listens:
        - listen:
            interface: 0.0.0.0
            port: 8080

      access_logs:
        - access_log:
            sink: console
      error_logs:
        - error_log:
            sink: console
            level: debug

      locations:
        - location:
            path: /
            root: ./www/net_practice
            indexFile: index.html
            allowedMethods:
              - GET
              - POST
              - HEAD
              - DELETE
