servers:
  - server:
      listens:
        - listen:
            interface: 0.0.0.0
            port: 8080
        - listen:
            interface: 127.0.0.1
            port: 3000

      maxRequestBodySize: 1048576
      timeoutSec: 60
      maxEvents: 1024

      access_logs:
        - access_log:
            sink: file
            filename: access.log
            logDir: ./log
            format: ELF
            maxSize: 100KB
            maxBackup: 5

      error_logs:
        - error_log:
            sink: file
            filename: error.log
            logDir: ./log
            format: JSON
            level: info
            filterMode: GREATER_OR_EQUAL
            maxSize: 1MB
            maxBackup: 3
        - error_log:
            sink: file
            filename: debug.log
            format: ELF
            level: debug
            filterMode: exact
            maxSize: 1MB
            maxBackup: 3

      locations:
        # Default location, allows most things, autoindex on
        - location:
            path: /
            root: /tmp/www
            uploadStore: /tmp/uploads
            indexFile: index.html
            autoindex: true
            allowedMethods:
              - GET
              - HEAD
              - POST
              - DELETE

        # Location for testing uploads and deletes specifically
        - location:
            path: /upload
            root: /tmp/uploads
            uploadStore: /tmp/uploads
            allowedMethods:
              - POST
              - DELETE

        # Location for testing 405 Method Not Allowed
        - location:
            path: /get_only
            root: /tmp/www
            allowedMethods:
              - GET

        # Location for testing 403 on a directory with autoindex off
        - location:
            path: /no_autoindex
            root: /tmp/www/no_autoindex_dir
            autoindex: false
            allowedMethods:
              - GET

        # Location for testing 403 on a file with no permissions
        - location:
            path: /forbidden
            root: /tmp/no_perms_default
            allowedMethods:
              - GET
