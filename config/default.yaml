servers:
  - server:
    listens:
      - listen:
          interface: 127.0.0.1
          port: 8080

    access_logs:
      - access_log:
          sink: console
    error_logs:
      - error_log:
          sink: console
          level: debug

    locations:
      - location:
          path: /
          root: ./www/net_practice
          index: index.html
          allowedMethods:
            - GET
            - POST
            - HEAD

  - server:
      listens:
        - listen:
            host: localhost
            interface: 127.0.0.1
            port: 8080

      maxRequestBodySize: 6291456
      maxRequestHeaderSize: 8KB
      maxEvents: 1024
      timeoutSec: 60
      requestHeaderTimeoutSec: 15
      requestBodyTimeoutSec: 30
      sessionTimeoutSec: 1800
      chunkedTimeoutSec: 10

      access_logs:
        - access_log:
            sink: file
            filename: access.log
            logDir: ./logs
            format: ELF
            maxSize: 100KB
            maxBackup: 5
        - access_log:
            sink : console
            format : ELF

      error_logs:
        - error_log:
            sink: file
            filename: debug.log
            logDir: ./logs
            format: ELF
            level: debug
            mode: GREATER_OR_EQUAL
            maxSize: 1MB
            maxBackup: 3
        - error_log:
            sink: file
            filename: error.log
            logDir: ./logs
            format: ELF
            level: warning
        - error_log:
            sink : console
            level : debug

      interpreterPath:
        .php: /usr/bin/php-cgi
        .py: /usr/bin/python3

      error_pages:
        404: /errors/404.html
        403: /errors/403.html
        500: /errors/500.html

      locations:
        - location:
            path: /
            root: ./www
            uploadStore: ./www/uploads
            index: index.html
            autoindex: false
            directoryError: directoryError.html
            session: true
            chunkedTimeoutSec: 20
            allowedMethods:
              - GET
              - HEAD
              - POST
              - DELETE

        - location:
            path: /cgi-bin
            root: ./www/cgi-bin/
            autoindex: true
            session: true
            interpreterPath:
              .cgi: /usr/bin/perl
              .php: /usr/bin/php-cgi
              .py: /usr/bin/python3
            allowedMethods:
              - GET
              - POST

        - location:
            path: /api
            root: ./www/api/
            autoindex: false
            session: true
            interpreterPath:
              .py: /usr/bin/python3
            allowedMethods:
              - GET
              - POST

        # Location for testing uploads and deletes specifically
        - location:
            path: /upload
            root: ./www/uploads
            uploadStore: ./uploads
            allowedMethods:
              - POST
              - DELETE

        - location:
            path: /cgi-bin/auth.py
            return: 301 /login.html

        - location:
            path: /cgi-bin/send_message.py
            return: 301 /chat.html

        - location:
            path: /cgi-bin/strange.py
            return: 301 /error.html

        - location:
            path: /errors
            root: ./www/static/errors
            allowedMethods:
              - GET

        # Location for testing 403 on a directory with autoindex off
        - location:
            path: /no_autoindex
            root: ./www/no_autoindex_dir
            autoindex: false
            allowedMethods:
              - GET

        - location:
            path: /no_index
            root: ./www/static
            noIndex: true
            allowedMethods:
                - HEAD
                - GET

        - location:
            path: /no_index_yes_autoindex
            root: ./www/static
            noIndex: true
            autoindex: true
            allowedMethods:
              - HEAD
              - GET

        # Location for testing 403 on a file with no permissions
        - location:
            path: /forbidden
            root: ./www/no_perms_default
            allowedMethods:
              - GET

        # Location for testing 405 Method Not Allowed
        - location:
            path: /get_only
            root: ./www/
            allowedMethods:
              - GET
