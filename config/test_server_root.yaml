servers:
  - server:
      listens:
        - listen:
            interface: 0.0.0.0
            port: 8888

      path: /
      root: www/http_test_root
      maxEvents: 1024
      access_logs:
        - access_log:
            sink: console
      error_logs:
        - error_log:
            sink: console
            level: debug
