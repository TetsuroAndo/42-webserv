# sample setting
# separator " | " (ascii 32 124 32)

# interface | port
listens :
  - 0.0.0.0 | 8080
  - 127.0.0.1 | 3000

defaultErrorPage : /tmp/www/error.html

# 1024 x 1024
maxRequestBodySize : 1048576

# true / false
isAllowGet : true
isAllowPost : true
isAllowHead : true
isAllowDelete : true

# old | code | new
redirect :
  - /old | 301 | /new
  - /api/v2 | 302 | /api/v3

# path | root
locations :
  - / | /tmp/www
  - /uploads | /tmp/uploads

# true/false
isShowDirectoryListPage : true

whenRequestedDirectory : /tmp/www/index.html
saveFileDirectory : /tmp/uploads

timeoutSec : 5
maxEvents : 1024
