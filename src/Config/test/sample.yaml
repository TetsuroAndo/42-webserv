# sample setting
servers:
　　- server :
      listens :
          - listen:
              - interface: 0.0.0.0
              - port: 8080
          - listen:
              - interface: 127.0.0.1
              - port: 3000

      defaultErrorPage : /tmp/www/error.html

      # 1024 x 1024
      maxRequestBodySize : 1048576

      # true / false
      isAllowGet : true
      isAllowPost : true
      isAllowHead : true
      isAllowDelete : true

      redirects :
        - redirect:
          - from: /old
          - to: /new
          - code: 301
        - redirect:
          - from: /
          - to: /tmp/www/index.html
          - code: 302

      locations :
        - location :
          - path : /
          - root : /tmp/www
        - location:
          - path : /uploads
          - root : /tmp/uploads

      # true/false
      isShowDirectoryListPage : true

      whenRequestedDirectory : /tmp/www/index.html
      saveFileDirectory : /tmp/uploads

      timeoutSec : 5
      maxEvents : 1024
