servers:
  - server:
      listens:
        - listen:
            interface: 0.0.0.0
            port: 8080

      redirects:
        - redirect:
            from: /prefix
            to: /new-prefix
            code: 301
        - redirect:
            from: /prefix/path
            to: /new-prefix/path-specific
            code: 301

      locations:
        - location:
            path: /
            root: /tmp/www
            indexFile: index.html
            autoindex: true
            allowedMethods:
              - GET
