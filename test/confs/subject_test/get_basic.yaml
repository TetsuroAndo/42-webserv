servers:
  - server:
      listens:
        - listen:
            interface: 0.0.0.0
            port: 8080

      error_logs:
        - error_log:
            disable: true

      access_logs:
        - access_log:
            disable: true

      locations:
        - location:
            path: /
            index: index.html
            root: ../../../test/test_www/static
            allowedMethods:
              - GET
              - HEAD
