servers:
  - server:
      listens:
        - listen:
            interface: 0.0.0.0
            port: 8080

      locations:
        - location:
            path: /
            root: ./www/http_test_root
            index: hello.txt
            allowedMethods:
              - GET

        - location:
            path: /api
            uploadStore: ./www/upload
            allowedMethods:
              - POST
