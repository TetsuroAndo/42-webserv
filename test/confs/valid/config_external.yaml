servers:
  - server:
      listens:
        - listen:
            interface: 0.0.0.0
            port: 8080

      redirects:
        - redirect:
            from: /external
            to: http://example.com
            code: 302

      locations:
        - location:
            path: /
            root: /tmp/www
            indexFile: index.html
            autoindex: true
            allowedMethods:
              - GET
