servers:
  - server:
      listens:
        - listen:
            interface: 0.0.0.0
            port: 8080

      locations:
        - location:
            path: /
            root: /tmp/www
            index: index.html
            autoindex: true
            allowedMethods:
              - GET
        - location:
            path: /external
            return: 302 http://example.com
