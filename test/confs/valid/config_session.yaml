servers:
  - server:
      error_logs:
        - error_log:
            sink: console
            level: debug
      sessionTimeoutSec: 1800
      listens:
        - listen:
            interface: 0.0.0.0
            port: 8080

      locations:
        - location:
            path: /
            root: ./test/test_www/static
            session: true
            allowedMethods:
              - GET
              - HEAD
