servers:
  - server:
      sessionTimeoutSec: 0
      listens:
        - listen:
            interface: 0.0.0.0
            port: 8080

      locations:
        - location:
            path: /
            root: ./test/test_www/static
            allowedMethods:
              - GET
              - HEAD

        - location:
            path: /not_allow_get
            root: ./test/test_www/static
            allowedMethods:
              - HEAD
