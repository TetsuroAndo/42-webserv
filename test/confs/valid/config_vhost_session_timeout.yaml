servers:
  - server:
      sessionTimeoutSec: 1
      listens:
        - listen:
            interface: 127.0.0.1
            port: 8080
      error_logs:
        - error_log:
            level: debug
            sink: console
      locations:
        - location:
            path: /
            root: ./test/test_www/static
            session: true
            allowedMethods:
              - GET
              - HEAD
  - server:
      sessionTimeoutSec: 3
      listens:
        - listen:
            interface: 127.0.0.2
            port: 8080
      error_logs:
        - error_log:
            level: debug
            sink: console
      locations:
        - location:
            path: /
            root: ./test/test_www/static
            session: true
            allowedMethods:
              - GET
              - HEAD
  - server:
      sessionTimeoutSec: 0
      listens:
        - listen:
            interface: 127.0.0.3
            port: 8080
      error_logs:
        - error_log:
            level: debug
            sink: console
      locations:
        - location:
            path: /
            root: ./test/test_www/static
            session: true
            allowedMethods:
              - GET
              - HEAD
