servers:
  - server:
      listens:
        - listen:
            interface: 127.0.0.1
            port: 8082

      locations:
        - location:
            path: /
            root: ./www
            index: index.html
            allowedMethods:
              - GET
              - POST

        - location:
            path: /session
            root: ./www
            allowedMethods:
              - GET
              - POST

        - location:
            path: /login
            root: ./www
            allowedMethods:
              - POST

        - location:
            path: /logout
            root: ./www
            allowedMethods:
              - POST
