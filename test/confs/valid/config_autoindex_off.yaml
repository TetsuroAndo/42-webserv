servers:
  - server:
      listens:
        - listen:
            interface: 0.0.0.0
            port: 8080

      locations:
        - location:
            path: /
            root: ./test/test_www
            autoindex: false
            allowedMethods:
              - GET
              - HEAD

        - location:
            path: /with_noIndex
            root: ./test/test_www/static
            autoindex: false
            noIndex: true
            index: index.html
            allowedMethods:
              - GET
              - HEAD