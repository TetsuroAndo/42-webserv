servers:
  - server:
      listens:
        - listen:
            interface: 0.0.0.0
            port: 8080

      locations:
        - location:
            path: /
            root: ./test/test_www/
            autoindex: true
            allowedMethods:
              - GET
              - HEAD
        - location:
            path: /with_index
            root: ./test/test_www/static
            autoindex: true
            index: index.html
            allowedMethods:
              - GET
              - HEAD