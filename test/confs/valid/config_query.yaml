servers:
  - server:
      listens:
        - listen:
            interface: 0.0.0.0
            port: 8080

      redirects:
        - redirect:
            from: /query
            to: /new-query
            code: 307

      locations:
        - location:
            path: /
            root: /tmp/www
            index: index.html
            autoindex: true
            allowedMethods:
              - GET
