servers:
  - server:
      listens:
        - listen:
            interface: 0.0.0.0
            port: 8080

      error_pages:
        404: /errors/Custom_404.html

      locations:
        - location:
            path: /
            root: ./test/test_www/static
            allowedMethods:
              - GET
              - HEAD

        - location:
            path: /errors
            root: ./test/test_www/static