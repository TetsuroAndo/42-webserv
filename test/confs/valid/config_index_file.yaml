servers:
  - server:
      listens:
        - listen:
            interface: 0.0.0.0
            port: 8080

      locations:
        - location:
            path: /
            root: ./test/test_www/static
            index: index.html
            allowedMethods:
              - GET
              - HEAD

        - location:
            path: /no_index
            root: ./test/test_www/static
            index: index.html
            noIndex: true
            allowedMethods:
              - GET
              - HEAD

