servers:
  - server:
      listens:
        - listen:
            interface: 0.0.0.0
            port: 8080

      maxRequestBodySize: 1KB
      timeoutSec: 60
      maxEvents: 1024

      access_logs:
        - access_log:
            disable: true

      error_logs:
        - error_log:
            sink: console
            level: debug
#            disable: true


      locations:
        # Location for testing uploads and deletes specifically
        - location:
            path: /upload
            root: ./test/test_www/uploads
            uploadStore: ./test/test_www/uploads
            allowedMethods:
              - GET
              - HEAD
              - PUT
              - DELETE