servers:
  - server:
      listens:
        - listen:
            interface: 0.0.0.0
            port: 8081

      redirects:
        - redirect:
            from: /redirect
            to: http://localhost:8081/hello.txt
            code: 301

      locations:
        - location:
            path: /
            root: ./www/http_test_root
            allowedMethods:
              - GET
              - HEAD
