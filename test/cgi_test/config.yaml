servers:
  - server:
      listens:
        - listen:
            interface: 127.0.0.1
            port: 8082

      maxRequestBodySize: 1048576
      timeoutSec: 60
      maxEvents: 128

      error_logs:
        - error_log:
            sink: file
            filename: error.log
            logDir: ./logs
            level: debug

      locations:
        - location:
            path: /cgi-bin
            root: ./cgi-bin
            allowedMethods:
              - GET
              - POST
            cgi:
              .py: /usr/bin/python3
